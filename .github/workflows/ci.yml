name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show active-toolchain
      - name: Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Frontend test
        working-directory: apps/desktop
        run: npm test
      - name: Frontend build
        working-directory: apps/desktop
        run: npm run build
      - name: M8 packaging safety
        shell: pwsh
        run: ./tests/m8/Invoke-M8SoftwareTests.ps1
      - name: M3 PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tests/m3/Invoke-M3WindowsIntegration.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List
            throw "M3 PowerShell parser reported $($errors.Count) error(s)."
          }
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
