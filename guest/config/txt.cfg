label printbridge-auto
  menu label ^PrintBridge unattended install
  kernel /install.amd/vmlinuz
  append vga=788 initrd=/install.amd/initrd.gz auto=true priority=critical preseed/file=/cdrom/preseed.cfg locale=en_US.UTF-8 keyboard-configuration/xkb-keymap=us netcfg/choose_interface=auto --- quiet
