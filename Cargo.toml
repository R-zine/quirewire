[workspace]
members = [
    "crates/domain",
    "crates/core",
    "crates/provider-virtualbox",
    "crates/provider-cups",
    "crates/provider-windows",
    "crates/ipc",
    "crates/agent",
    "crates/cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
printbridge-agent = { path = "crates/agent" }
printbridge-core = { path = "crates/core" }
printbridge-domain = { path = "crates/domain" }
printbridge-ipc = { path = "crates/ipc" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
